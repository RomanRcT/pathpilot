id: io.github.RomanRcT.PathPilot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pathpilot
branch: stable

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.gtk.vfs.*

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/pathpilot/cargo

modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dapp=false
      - -Ddocs=false
      - -Dgir=false
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.0.tar.xz
        sha256: 0414e31583836aeb7878da25f67c515f7e8879917ecc37c92e26b83e8d8fc3e3

  - name: pathpilot
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ../..
