name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    name: Format, Clippy, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native and document preview dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev pkg-config xvfb xauth dbus poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      # WebKit's bubblewrap sandbox needs them on this disposable test runner.
      - name: Allow WebKit sandbox on the test runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Check engine pins and license notices
        run: python3 tools/document-licenses.py

      - name: Test source archive tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Test PDF and office document previews
        run: cargo test -p pathpilot-preview -- --ignored

      - name: Test tab navigation, clipboard and idle confirmation
        env:
          G_DEBUG: fatal-criticals
        run: dbus-run-session -- xvfb-run -a cargo test -p pathpilot-ui-gtk --lib tabs::tests::workspace_tabs_keep_state_share_clipboard_and_commit_selection -- --ignored --test-threads=1

      - name: Test Markdown HTML with WebKitGTK
        env:
          PATHPILOT_TEST_MARKDOWN_DIR: ${{ runner.temp }}/markdown-previews
        run: dbus-run-session -- xvfb-run -a cargo test -p pathpilot-ui-gtk --test markdown-webkit -- --ignored

      - name: Test independent viewer navigation and lifetime
        env:
          G_DEBUG: fatal-criticals
          PATHPILOT_TEST_VIEWER_SCREENSHOT: ${{ runner.temp }}/markdown-previews/viewer.png
        run: dbus-run-session -- xvfb-run -a cargo test -p pathpilot-ui-gtk --test viewer-window -- --ignored

      - name: Upload Markdown preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-preview-screenshots
          path: ${{ runner.temp }}/markdown-previews/*.png
          if-no-files-found: ignore

  renovate:
    name: Validate dependency update configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes --package=renovate@44.155.4 renovate-config-validator --strict renovate.json
