name: Release packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-packages.yml'
      - 'packaging/**'
      - 'Makefile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/**'
      - 'data/licenses/**'
      - 'renovate.json'
      - 'data/io.github.RomanRcT.PathPilot.desktop'
      - 'data/io.github.RomanRcT.PathPilot.metainfo.xml'
      - 'data/icons/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the packages
        required: true
        default: v0.3.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'pull_request' && 'v0.3.0' || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Compare tag and package versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          rpm_version="$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/pathpilot.spec)"
          appstream_version="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.RomanRcT.PathPilot.metainfo.xml | head -n 1)"
          if [ "${{ github.event_name }}" = pull_request ]; then expected="$cargo_version"; fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          test "$expected" = "$cargo_version"
          test "$expected" = "$rpm_version"
          test "$expected" = "$appstream_version"

  source:
    name: Build and verify offline source
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: v${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create source archive with locked dependencies and notices
        run: python3 tools/create-offline-source.py --output release-assets

      - name: Build offline with an empty Cargo cache
        run: python3 tools/verify-offline-source.py release-assets/pathpilot-${RELEASE_TAG#v}-offline-source.tar.gz --release

      - name: Upload offline source archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: offline-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  rpm:
    name: Fedora RPM
    needs: [validate, source]
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      RELEASE_TAG: v${{ needs.validate.outputs.version }}
    steps:
      - name: Install build dependencies
        run: >-
          dnf install --assumeyes
          appstream cargo desktop-file-utils gcc git gzip make pkgconf-pkg-config rpm-build rust tar
          libadwaita-devel
          gtk4-devel vte291-gtk4-devel

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download verified source
        uses: actions/download-artifact@v4
        with:
          name: offline-source
          path: source-archive

      - name: Verify source checksum
        working-directory: source-archive
        run: sha256sum --check *.sha256

      - name: Build RPM packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p "$HOME/rpmbuild/SOURCES" release-assets
          cp "source-archive/pathpilot-${version}-offline-source.tar.gz" "$HOME/rpmbuild/SOURCES/pathpilot-${version}.tar.gz"
          rpmbuild -ba packaging/rpm/pathpilot.spec
          cp "$HOME"/rpmbuild/RPMS/x86_64/pathpilot-${version}-*.x86_64.rpm release-assets/
          cp "$HOME"/rpmbuild/SRPMS/pathpilot-${version}-*.src.rpm release-assets/

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: release-assets/*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: [validate, source]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: v${{ needs.validate.outputs.version }}
    steps:
      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install --yes flatpak flatpak-builder

      - name: Add Flathub and install SDKs
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download verified source
        uses: actions/download-artifact@v4
        with:
          name: offline-source
          path: source-archive

      - name: Unpack verified source
        run: |
          cd source-archive
          sha256sum --check *.sha256
          mkdir ../offline-source
          tar -xzf pathpilot-${RELEASE_TAG#v}-offline-source.tar.gz -C ../offline-source

      - name: Build Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd "offline-source/pathpilot-${version}"
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            build-flatpak packaging/flatpak/io.github.RomanRcT.PathPilot.yml
          flatpak build-bundle flatpak-repo \
            "PathPilot-${version}-x86_64.flatpak" \
            io.github.RomanRcT.PathPilot stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: offline-source/pathpilot-*/PathPilot-*.flatpak
          if-no-files-found: error

  publish:
    name: Attach packages to release
    if: github.event_name != 'pull_request'
    needs: [rpm, flatpak, source]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Create release when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --title "PathPilot $RELEASE_TAG" --prerelease --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
