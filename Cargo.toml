[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/config",
    "crates/fs-local",
    "crates/operations",
    "crates/preview",
    "crates/ui-gtk",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gio = { version = "0.21", features = ["v2_72"] }
gdk-pixbuf = "0.21"
glib = "0.21"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
vte = { package = "vte4", version = "0.9" }
pathpilot-core = { path = "crates/core" }
pathpilot-config = { path = "crates/config" }
pathpilot-fs-local = { path = "crates/fs-local" }
pathpilot-operations = { path = "crates/operations" }
pathpilot-preview = { path = "crates/preview" }
pathpilot-ui-gtk = { path = "crates/ui-gtk" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
webkit6 = "0.5"

# Pin the document engines to fixed revisions; no editor UI dependencies.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "159b84f54c74e9e82fb3109b758ae7dd6f4e3ab0" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "159b84f54c74e9e82fb3109b758ae7dd6f4e3ab0" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "159b84f54c74e9e82fb3109b758ae7dd6f4e3ab0" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "159b84f54c74e9e82fb3109b758ae7dd6f4e3ab0" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "159b84f54c74e9e82fb3109b758ae7dd6f4e3ab0" }
gridcraft-core = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
gridcraft-numfmt = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
cairo-rs = { version = "0.21", features = ["png"] }
pango = "0.21"
pangocairo = "0.21"
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
